name: Build EscFR

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: escfr-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  ESCFR_APP_DIR: samples/Sample 10 - EscFR Browser

jobs:
  linux:
    name: Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build & runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build p7zip-full g++ \
            libgl1-mesa-dri libglx-mesa0 libglu1-mesa libgl1 \
            libx11-6 libxrandr2 libxi6 libxcursor1 libxinerama1 libasound2t64 \
            xvfb x11-utils imagemagick xdotool

      - name: Configure (EscFR only)
        run: |
          cmake -S samples -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DESCFR_ONLY=ON

      - name: Build EscFR
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cmake --build build --target EscFR --parallel 4 > build.log 2>&1

      - name: Surface build result
        if: always()
        shell: bash
        run: |
          echo "### Linux build outcome: ${{ steps.build.outcome }}"
          echo "### Tail of build.log"
          { echo '```'; tail -n 80 build.log 2>/dev/null || echo '(no build.log)'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          grep -iE "error|failed|cannot|no rule" build.log 2>/dev/null | head -8 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          if [ "${{ steps.build.outcome }}" != "success" ]; then exit 1; fi

      - name: Smoke test under Xvfb
        run: bash .github/scripts/linux-smoke.sh "build/${ESCFR_APP_DIR}"

      - name: Package
        run: |
          APP_DIR="build/${ESCFR_APP_DIR}"
          mkdir -p dist
          cd "$APP_DIR"
          tar -czf "$GITHUB_WORKSPACE/dist/EscFR-linux-x64.tar.gz" \
            EscFR assets $(ls *.so* 2>/dev/null || true)
          cd "$GITHUB_WORKSPACE"
          ls -lh dist

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EscFR-linux-x64
          path: |
            dist/EscFR-linux-x64.tar.gz
            build/samples/Sample 10 - EscFR Browser/*.png
            build/samples/Sample 10 - EscFR Browser/*.log
          if-no-files-found: warn

  windows:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Ensure build tools
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y --no-progress
          }
          if (-not (Get-Command 7z -ErrorAction SilentlyContinue)) {
            choco install 7zip -y --no-progress
          }
          ninja --version
          (Get-Command 7z).Source
          cmake --version

      - name: Configure (EscFR only)
        shell: pwsh
        run: |
          cmake -S samples -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DESCFR_ONLY=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build EscFR
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cmake --build build --target EscFR --parallel 4 > build.log 2>&1

      - name: Surface build result
        if: always()
        shell: bash
        run: |
          echo "### Windows build outcome: ${{ steps.build.outcome }}"
          echo "### Tail of build.log"
          { echo '```'; tail -n 80 build.log 2>/dev/null || echo '(no build.log)'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          grep -iE "error|failed|cannot|no rule" build.log 2>/dev/null | head -8 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          if [ "${{ steps.build.outcome }}" != "success" ]; then exit 1; fi

      - name: Verify binary & assets
        shell: pwsh
        run: |
          $app = "build/$env:ESCFR_APP_DIR/EscFR.exe"
          if (-not (Test-Path $app)) { throw "EscFR.exe was not produced" }
          Get-Item $app | Format-List Name, Length
          $assets = "build/$env:ESCFR_APP_DIR/assets"
          foreach ($f in @('ui.html', 'ui.css', 'ui.js', 'wired.css', 'new_tab_page.html', 'settings.html', 'about.html')) {
            if (-not (Test-Path (Join-Path $assets $f))) { throw "missing asset: $f" }
          }
          Get-ChildItem "build/$env:ESCFR_APP_DIR" | Select-Object Name, Length

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $appDir = "build/$env:ESCFR_APP_DIR"
          Push-Location $appDir
          $files = @('EscFR.exe', 'assets') + (Get-ChildItem -Filter *.dll | ForEach-Object { $_.Name })
          & 7z a "$env:GITHUB_WORKSPACE/dist/EscFR-win-x64.zip" @files
          if ($LASTEXITCODE -ne 0) { throw "7z failed" }
          Pop-Location
          Get-ChildItem dist

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EscFR-win-x64
          path: |
            dist/EscFR-win-x64.zip
            build/samples/Sample 10 - EscFR Browser/*.log
          if-no-files-found: warn
