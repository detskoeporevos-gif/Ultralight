name: diag headers

on:
  push:
    paths:
      - ".github/workflows/diag-headers.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headers:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build p7zip-full

      - name: Configure
        run: cmake -S samples -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DESCFR_ONLY=ON

      - name: Fetch SDK headers
        run: cmake --build build --target CopySDK

      - name: Dump String header
        if: always()
        shell: bash
        run: |
          HDR=$(find build -name 'String.h' -path '*Ultralight*' | head -1)
          echo "found: $HDR"
          if [ -z "$HDR" ]; then
            find build -maxdepth 3 -type d | head -30 | while IFS= read -r line; do echo "::error::dir $line"; done
            exit 0
          fi
          grep -vE '^\s*(//|\*|/\*)' "$HDR" | tr '\n' ' ' | sed 's/  */ /g' | fold -w 900 | head -9 | nl -ba | while IFS= read -r line; do
            echo "::error::L$line"
          done

      - name: Archive headers
        if: always()
        run: |
          mkdir -p out
          if [ -d build/SDK/include ]; then
            tar -czf out/ultralight-headers.tar.gz -C build/SDK/include .
          fi
          ls -la out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ultralight-headers
          path: out/ultralight-headers.tar.gz
          if-no-files-found: warn
