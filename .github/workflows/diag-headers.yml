name: diag headers

on:
  push:
    paths:
      - ".github/workflows/diag-headers.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headers:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        hdr: [String8, String16, JSValue, KeyEvent, View, Overlay, String32]
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build p7zip-full

      - name: Configure
        run: cmake -S samples -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DESCFR_ONLY=ON

      - name: Fetch SDK headers
        run: cmake --build build --target CopySDK

      - name: Dump header
        if: always()
        shell: bash
        run: |
          HDR=$(find build/SDK/include -name "${{ matrix.hdr }}.h" | head -1)
          echo "found: $HDR"
          if [ -z "$HDR" ]; then
            find build/SDK/include -name '*.h' | head -20 | while IFS= read -r line; do echo "::error::file $line"; done
            exit 0
          fi
          grep -vE '^\s*(//|\*|/\*)' "$HDR" | tr '\n' ' ' | sed 's/  */ /g' | fold -w 880 | head -9 | nl -ba | while IFS= read -r line; do
            echo "::error::${{ matrix.hdr }}|$line"
          done
