<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="utf-8">
  <title>Новая вкладка</title>
  <link rel="stylesheet" type="text/css" href="wired.css">
  <style>
    .nt {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 46px 32px 30px;
    }

    .nt-status {
      display: flex;
      align-items: center;
      margin-bottom: 42px;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 2.4px;
      text-transform: uppercase;
      color: var(--text-faint);
    }

    .nt-status > * + * {
      margin-left: 12px;
    }

    .nt-status .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--red);
      box-shadow: 0 0 8px var(--red);
      animation: blink 2.4s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }

    .nt-status b {
      color: var(--cyan);
      font-weight: 400;
    }

    .brand {
      display: flex;
      align-items: center;
      margin-bottom: 34px;
    }

    .brand svg {
      margin-right: 14px;
    }

    .brand svg {
      width: 44px;
      height: 44px;
      opacity: 0.9;
    }

    .brand h1 {
      font-size: 30px;
      font-weight: 500;
      letter-spacing: -0.01em;
      color: #e8e8ea;
      line-height: 1;
    }

    .brand h1 span {
      color: var(--red);
    }

    .tagline {
      margin: 16px 0 34px;
      font-family: var(--serif);
      font-style: italic;
      font-size: 17px;
      color: var(--text-dim);
      letter-spacing: 0.3px;
      text-align: center;
    }

    .tagline code {
      font-family: var(--mono);
      font-style: normal;
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--text-faint);
      text-transform: uppercase;
    }

    /* search */
    .search {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
      max-width: 660px;
      height: 52px;
      padding: 0 20px;
      border: 1px solid #2c2c2c;
      border-radius: 12px;
      background: linear-gradient(180deg, #131315, #0d0d0f);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.03);
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    .search:focus-within {
      border-color: rgba(230, 230, 234, 0.65);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(230, 230, 234, 0.2),
        0 0 28px rgba(230, 230, 234, 0.14);
    }

    .search .ico {
      width: 18px;
      height: 18px;
      flex: 0 0 18px;
      margin-right: 14px;
      color: var(--text-faint);
    }

    .search .ico svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .search input {
      flex: 1;
      min-width: 0;
      height: 46px;
      border: none;
      outline: none;
      background: transparent;
      color: var(--text);
      font-family: var(--mono);
      font-size: 13.5px;
      letter-spacing: 0.2px;
    }

    .search input::placeholder {
      color: var(--text-faint);
    }

    .search .engine {
      flex: 0 0 auto;
      margin-left: 12px;
      padding: 4px 10px;
      border: 1px solid rgba(230, 230, 234, 0.28);
      border-radius: 4px;
      font-family: var(--mono);
      font-size: 9.5px;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      color: var(--cyan);
      background: rgba(230, 230, 234, 0.06);
    }

    /* tiles */
    .tiles {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 830px;
      margin: 34px auto 0;
    }

    .tile {
      position: relative;
      display: flex;
      align-items: center;
      width: 248px;
      margin: 0 7px 14px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: linear-gradient(180deg, #191919, #101012);
      color: var(--text);
      transition: border-color 140ms ease, transform 140ms ease, background 140ms ease;
    }

    .tile:hover {
      border-color: #4b4b4b;
      background: linear-gradient(180deg, #222222, #161616);
      transform: translateY(-2px);
      text-decoration: none;
      color: var(--text);
    }

    .tile .glyph {
      margin-right: 12px;
      width: 32px;
      height: 32px;
      flex: 0 0 32px;
      border: 1px solid #414141;
      border-radius: 8px;
      background: linear-gradient(150deg, #2b2b2b, #181818);
      font-family: var(--mono);
      font-size: 14px;
      font-weight: 600;
      color: var(--cyan);
      text-align: center;
      line-height: 30px;
      text-transform: uppercase;
    }

    .tile.internal .glyph {
      border-color: rgba(156, 156, 164, 0.42);
      color: var(--red);
      background: linear-gradient(150deg, #2a1520, #140b10);
    }

    .tile .txt {
      min-width: 0;
    }

    .tile b {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tile span {
      display: block;
      font-family: var(--mono);
      font-size: 9.5px;
      letter-spacing: 0.6px;
      color: var(--text-faint);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .nt-hints {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 40px;
      font-size: 11.5px;
      color: var(--text-faint);
    }

    .nt-hints div {
      display: flex;
      align-items: center;
      margin: 0 13px 10px;
    }

    .nt-hints .kbd + .kbd {
      margin-left: 7px;
    }

    .nt-hints .kbd:last-child {
      margin-right: 7px;
    }

    .foot {
      margin-top: 48px;
    }

    @media (max-width: 720px) {
      .brand h1 {
        font-size: 34px;
      }
      .brand svg {
        width: 48px;
        height: 48px;
      }
      .tile {
        width: 100%;
        max-width: 340px;
      }
    }
  </style>
</head>

<body>
  <div class="page nt">
    <div class="brand">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="32" cy="32" r="29" fill="none" stroke="#2c2c2c" stroke-width="1.6" />
        <circle cx="32" cy="32" r="21" fill="none" stroke="#212125" stroke-width="1.2" />
        <path d="M32 4a28 28 0 0 1 24.2 42" fill="none" stroke="#9e9e9e" stroke-width="3.4"
          stroke-linecap="round" />
        <path d="M32 60A28 28 0 0 1 7.8 18" fill="none" stroke="#e6e6ea" stroke-width="3.4"
          stroke-linecap="round" />
        <path d="M32 12a20 20 0 1 1-14.1 34.1" fill="none" stroke="#b2b2b2" stroke-width="2.4"
          stroke-linecap="round" opacity="0.85" />
      </svg>
      <h1>EscFR</h1>
    </div>

    <form class="search" id="search" autocomplete="off">
      <span class="ico">
        <svg viewBox="0 0 16 16">
          <path
            d="M7 1.7a5.3 5.3 0 1 0 3.3 9.5l3.1 3.1 1.2-1.2-3.1-3.1A5.3 5.3 0 0 0 7 1.7Zm0 1.7a3.6 3.6 0 1 1 0 7.2 3.6 3.6 0 0 1 0-7.2Z" />
        </svg>
      </span>
      <input id="q" type="text" placeholder="Поиск или адрес" spellcheck="false">
      <span class="engine" id="engine">duckduckgo</span>
    </form>

    <div class="tiles">
      <a class="tile" href="https://ru.wikipedia.org">
        <span class="glyph">W</span>
        <span class="txt"><b>Wikipedia</b><span>ru.wikipedia.org</span></span>
      </a>
      <a class="tile" href="https://news.ycombinator.com">
        <span class="glyph">H</span>
        <span class="txt"><b>Hacker News</b><span>news.ycombinator.com</span></span>
      </a>
      <a class="tile" href="https://docs.ultralig.ht">
        <span class="glyph">U</span>
        <span class="txt"><b>Ultralight Docs</b><span>docs.ultralig.ht</span></span>
      </a>
      <a class="tile internal" href="esc://settings" data-internal="esc://settings">
        <span class="glyph">S</span>
        <span class="txt"><b>Настройки</b><span>esc://settings</span></span>
      </a>
      <a class="tile internal" href="esc://about" data-internal="esc://about">
        <span class="glyph">E</span>
        <span class="txt"><b>О EscFR</b><span>esc://about</span></span>
      </a>
      <a class="tile" href="https://github.com">
        <span class="glyph">G</span>
        <span class="txt"><b>GitHub</b><span>github.com</span></span>
      </a>
    </div>

  </div>

  <script>
    (function () {
      'use strict';

      var engines = {
        duckduckgo: { name: 'duckduckgo', url: 'https://duckduckgo.com/?q=' },
        google: { name: 'google', url: 'https://www.google.com/search?q=' },
        bing: { name: 'bing', url: 'https://www.bing.com/search?q=' },
        yandex: { name: 'yandex', url: 'https://yandex.com/search/?text=' }
      };
      var settings = { searchEngine: 'duckduckgo' };

      function native(name) {
        return typeof window[name] === 'function' ? window[name] : null;
      }

      function navigate(url) {
        var fn = native('escFRNavigate');
        if (fn) fn(url);
        else window.location.href = url;
      }

      function searchUrl(query) {
        var engine = engines[settings.searchEngine] || engines.duckduckgo;
        return engine.url + encodeURIComponent(query);
      }

      function resolve(raw) {
        var text = (raw || '').trim();
        if (!text) return '';
        if (/^(esc|file|https?|data|about):/i.test(text)) {
          if (text.toLowerCase() === 'about:home') return 'esc://newtab';
          return text;
        }
        if (/^[a-z0-9][a-z0-9\-\.]*\.[a-z]{2,}([\/?#].*)?$/i.test(text)) return 'http://' + text;
        if (/^localhost(:\d+)?(\/.*)?$/i.test(text)) return 'http://' + text;
        return searchUrl(text);
      }

      function applyEngine() {
        var engine = engines[settings.searchEngine] || engines.duckduckgo;
        var el = document.getElementById('engine');
        if (el) el.textContent = engine.name;
      }

      var started = false;

      function ready() {
        if (started) return;
        started = true;
        applyEngine();

        document.getElementById('search').addEventListener('submit', function (ev) {
          ev.preventDefault();
          var url = resolve(document.getElementById('q').value);
          if (url) navigate(url);
        });

        Array.prototype.forEach.call(document.querySelectorAll('[data-internal]'), function (tile) {
          tile.addEventListener('click', function (ev) {
            ev.preventDefault();
            navigate(tile.getAttribute('data-internal'));
          });
        });

        var now = new Date();
        document.getElementById('clock').textContent =
          String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0') + ' // ' + now.getFullYear();
      }

      window.__escFRInit = function (json) {
        try {
          var parsed = JSON.parse(json || '{}');
          if (parsed && parsed.searchEngine) settings.searchEngine = parsed.searchEngine;
        } catch (e) { /* keep defaults */ }
        applyEngine();
        ready();
      };

      ready();
    })();
  </script>
</body>

</html>
